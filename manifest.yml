modules:
  'jira:projectPage':
    - key: jiralogger-pro-project-page
      resource: main
      title: JiraLogger Pro
      icon: https://raw.githubusercontent.com/SanskarSethiya-MXT/JiraLogger/main/public/icon.svg
  'jira:globalPage':
    - key: jiralogger-pro-global-page
      resource: main
      title: JiraLogger Pro
      icon: https://raw.githubusercontent.com/SanskarSethiya-MXT/JiraLogger/main/public/icon.svg
resources:
  - key: main
    path: static/
app:
  runtime:
    name: nodejs20.x
  id: ari:cloud:ecosystem::app/be7a4d78-7d81-444a-92dd-f2f0e009ce06
permissions:
  scopes:
    - write:jira-work
    - read:jira-work
    - read:jira-user
  content:
    styles:
      - unsafe-inline
    scripts:
      - unsafe-inline
      - unsafe-eval
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: generativelanguage.googleapis.com
        - address: localhost:9002
        - address: 127.0.0.1:9002
