
modules:
  'jira:projectPage':
    - key: jiralogger-pro-project-page
      resource: main
      title: JiraLogger Pro
      icon: https://raw.githubusercontent.com/SanskarSethiya-MXT/JiraLogger/main/public/icon.svg
  'jira:globalPage':
    - key: jiralogger-pro-global-page
      resource: main
      title: JiraLogger Pro
      icon: https://raw.githubusercontent.com/SanskarSethiya-MXT/JiraLogger/main/public/icon.svg
resources:
  - key: main
    path: src/app/page.tsx
app:
  id: 'ari:cloud:ecosystem::app/YOUR_APP_ID_HERE'
  # Replace YOUR_APP_ID_HERE with your actual Forge app ID after running 'forge register'
permissions:
  scopes:
    - 'write:jira-work'
    - 'read:jira-work'
    - 'read:jira-user'
  content:
    styles:
      - 'unsafe-inline'
    scripts:
      - 'unsafe-inline'
      - 'unsafe-eval'
  external:
    fetch:
      backend:
        - '*.atlassian.net'
        - 'generativelanguage.googleapis.com'

